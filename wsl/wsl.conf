# WSL configuration baked into the kdocker WSL rootfs.
# This file is inert when the image is used as a normal Docker container and
# only takes effect when the filesystem is imported as a WSL2 distribution.

[boot]
systemd=true

[user]
default=kdev

[network]
generateResolvConf=true
generateHosts=true

[interop]
enabled=true
appendWindowsPath=true

[automount]
enabled=true
options=metadata,uid=1000,gid=1000,umask=022
