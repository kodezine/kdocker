[package]
name = "kdlauncher"
version = "0.1.0"
edition = "2021"
description = "Windows launcher that installs and manages kdocker WSL2 distributions from a declarative manifest."
license = "MIT"
repository = "https://github.com/kodezine/kdocker"
default-run = "kdlauncher"

[[bin]]
name = "kdlauncher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
